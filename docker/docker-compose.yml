services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gatums
      POSTGRES_PASSWORD: gatums_dev
      POSTGRES_DB: gatums
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatums"]
      interval: 5s
      timeout: 5s
      retries: 5

