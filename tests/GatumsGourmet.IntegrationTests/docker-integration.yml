# Docker Compose para testes de integração.
# Sobe apenas o PostgreSQL (a API roda in-memory via WebApplicationFactory).
# Porta 5433 para não conflitar com o PostgreSQL de desenvolvimento (5432).
#
# Cria DOIS bancos com o mesmo usuário/senha:
#   - gatums       (via POSTGRES_DB) — espelha o nome de produção/dev local.
#   - gatums_test  (via script em init-db/) — usado pelos testes de integração.
#
# Gerenciado manualmente na máquina (docker compose -f docker-integration.yml up -d).
# O up/down automático via CliWrap está desativado na CustomWebApplicationFactory.

services:
  postgres:
    image: postgres:16-alpine
    container_name: gatums-gourmet-db-test-integration
    environment:
      POSTGRES_USER: gatums
      POSTGRES_PASSWORD: gatums_test
      POSTGRES_DB: gatums_test
    ports:
      - "5433:5432"
    volumes:
      # Scripts em /docker-entrypoint-initdb.d são executados na 1ª inicialização
      # do volume. Cria o banco gatums_test além do gatums (POSTGRES_DB).
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatums -d gatums"]
      interval: 3s
      timeout: 3s
      retries: 10

  # MinIO: storage S3-compatível local para os testes de integração do upload
  # de imagens (S3ImageStorageListDeleteTests e o caso real do upload). Os testes
  # sondam a porta 9000 e fazem skip suave se ela não responder — subir este
  # serviço habilita os testes reais. Mesma imagem/config do docker/docker-compose.yml.
  #
  # NOTA sobre a imagem: a MinIO removeu as imagens da comunidade do Docker Hub
  # (set/2026) e as do quay.io passaram a exigir login. Usamos a imagem da Bitnami
  # (namespace bitnamilegacy), pinada por digest. O bucket é criado no startup e
  # já fica com leitura pública via MINIO_DEFAULT_BUCKETS (sufixo ":public").
  minio:
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    container_name: gatums-gourmet-minio-test-integration
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: gatums-imagens:public
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  miniodata:
